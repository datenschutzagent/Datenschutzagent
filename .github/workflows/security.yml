name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 04:00 UTC – catches newly-disclosed CVEs
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sast:
    name: Python SAST (Bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: pip-audit – CVE check
        # Fails on ANY known vulnerability in the resolved dependency tree.
        # (pip-audit has no severity filter; the previously used
        # --fail-on-vuln-severity flag does not exist and broke the job.)
        run: pip-audit -r backend/requirements.txt

      - name: Bandit – Python SAST
        # Gate: bandit exits 1 on any finding at or above the severity level, also with
        # --format json (verified 2026-09-05). Skips: B101 (assert in tests), B110
        # (try-except-pass — reviewed), B608 (string-built SQL — reviewed 2026-06: all raw
        # queries interpolate only hardcoded filter fragments and bind values via :params;
        # SQL injection coverage remains via the Semgrep job, p/owasp-top-ten).
        run: |
          bandit -r backend/app/ \
            --severity-level medium \
            --skip B101,B110,B608 \
            --format json \
            --output bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  frontend-security:
    name: Frontend Security (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: npm audit – HIGH/CRITICAL vulnerabilities
        run: npm audit --audit-level=high

  semgrep:
    name: Semgrep SAST (OWASP Top 10 + Secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Semgrep (full report, all severities)
        run: |
          semgrep \
            --config=p/python \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --json \
            --output semgrep-report.json \
            backend/app/

      - name: Semgrep gate (ERROR severity)
        # Without --error semgrep always exits 0, so the step above only produces an
        # artifact. This step fails the job on ERROR-severity findings; WARNING/INFO stay
        # visible in the report. Tighten to --severity WARNING once the report is clean.
        run: |
          semgrep \
            --config=p/python \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --severity ERROR \
            --error \
            --quiet \
            backend/app/

      - name: Upload Semgrep report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Trivy – expired exceptions
        # Every .trivyignore entry carries an "# Expires: YYYY-MM-DD" line. Once that
        # date has passed the exception must be re-reviewed (removed or extended with a
        # fresh justification) — this step turns red instead of letting it rot silently.
        run: |
          today=$(date -u +%F)
          status=0
          while IFS= read -r line; do
            expires=$(printf '%s' "$line" | sed -nE 's/^# *Expires: *([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/p')
            if [ -n "$expires" ] && [ "$expires" \< "$today" ]; then
              echo "::error file=.trivyignore::expired exception ($expires): $line"
              status=1
            fi
          done < .trivyignore
          exit $status

      - name: Build backend image for scanning
        run: docker build -t datenschutzagent-backend:scan backend/

      - name: Trivy – gate on fixable HIGH/CRITICAL
        # This is the actual gate. It must use a non-SARIF format: with format=sarif the
        # action drops the severity filter ("Building SARIF report with all severities"),
        # so an exit-code there would fire on ANY severity. Table output also makes a red
        # gate diagnosable directly from the job log.
        # ignore-unfixed: unfixed base-image CVEs are not actionable and made the gate
        # permanently red — remaining failures always mean an available fix exists.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: 'datenschutzagent-backend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'
          trivyignores: '.trivyignore'

      - name: Trivy – SARIF upload (non-gating)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: 'datenschutzagent-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: 'true'
          trivyignores: '.trivyignore'
          skip-setup-trivy: 'true'  # already set up by the gate step above

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  secret-scan:
    name: Secret Detection (detect-secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        # Same version as .pre-commit-config.yaml so local and CI results match.
        run: pip install detect-secrets==1.5.0

      - name: Check for new secrets
        # Gate: fails on any potential secret that is not already recorded in
        # .secrets.baseline (the baseline carries its own exclude filters). To accept a
        # false positive, refresh the baseline locally:
        #   detect-secrets scan --baseline .secrets.baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Full scan report (artifact)
        if: always()
        run: |
          detect-secrets scan \
            --exclude-files '\.env\.example$' \
            --exclude-files '\.secrets\.baseline$' \
            > .secrets.scan-result.json

      - name: Upload secrets report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: secrets-scan-report
          path: .secrets.scan-result.json

  sbom:
    name: SBOM (CycloneDX – Backend + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Backend SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements backend/requirements.txt -o sbom-backend.json

      - name: Frontend SBOM (CycloneDX)
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-frontend.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom
          path: |
            sbom-backend.json
            sbom-frontend.json
