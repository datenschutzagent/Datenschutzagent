name: Nightly

# Slow or provider-dependent quality checks that do not belong in the PR gate:
#   * the full Playwright suite against the Docker stack (the PR gate runs @smoke only),
#   * LLM-backed evals against a real provider (skipped without credentials).
# Both publish artifacts; a red nightly is a signal to look at, not a merge blocker.
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: datenschutzagent_evals
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/datenschutzagent_evals # pragma: allowlist secret
      APP_ENVIRONMENT: test
      OLLAMA_ENABLED: "false"
      # Provider for the LLM-backed suite. Configure in the repository settings:
      #   variable NIGHTLY_LLM_PROVIDER  = openai | anthropic
      #   secret   NIGHTLY_LLM_API_KEY   = the provider key
      # Without both, only the offline suites run (the step below says so).
      LLM_PROVIDER: ${{ vars.NIGHTLY_LLM_PROVIDER || 'ollama' }}
      OPENAI_API_KEY: ${{ vars.NIGHTLY_LLM_PROVIDER == 'openai' && secrets.NIGHTLY_LLM_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ vars.NIGHTLY_LLM_PROVIDER == 'anthropic' && secrets.NIGHTLY_LLM_API_KEY || '' }}
      # Evals send synthetic sample texts only; the DSGVO acknowledgement flag exists
      # so the app refuses external providers unless the operator opted in explicitly.
      LLM_EXTERNAL_TRANSFER_ACKNOWLEDGED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Offline evals (extraction, grounding)
        run: python -m evals.run --out ../evals-offline.json
        working-directory: backend
      - name: LLM evals (strict)
        # --strict: a suite that cannot run (bad key, provider down) fails the job instead
        # of silently passing with only the offline scores.
        if: ${{ vars.NIGHTLY_LLM_PROVIDER != '' }}
        run: python -m evals.run --llm --strict --json --out ../evals-llm.json
        working-directory: backend
      - name: LLM evals not configured
        if: ${{ vars.NIGHTLY_LLM_PROVIDER == '' }}
        run: echo "::notice::NIGHTLY_LLM_PROVIDER / NIGHTLY_LLM_API_KEY not set - LLM evals skipped"
      - name: Upload eval summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-${{ github.run_number }}
          path: evals-*.json
          retention-days: 90

  e2e-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      # Same throwaway configuration as the e2e job in test.yml.
      - name: Write CI .env
        run: | # pragma: allowlist secret
          cat > .env <<'EOF'
          APP_ENVIRONMENT=test
          POSTGRES_USER=datenschutzagent
          POSTGRES_PASSWORD=ci_pw
          POSTGRES_DB=datenschutzagent
          DATABASE_URL=postgresql+asyncpg://datenschutzagent:ci_pw@postgres:5432/datenschutzagent
          REDIS_PASSWORD=ci_redis
          WEAVIATE_API_KEY=ci_weaviate
          MINIO_ROOT_USER=ciminio
          MINIO_ROOT_PASSWORD=ciminiopw123
          RBAC_DEFAULT_ROLE=admin
          OLLAMA_ENABLED=false
          CELERY_ENABLED=false
          WEAVIATE_INDEXING_ENABLED=false
          CORS_ORIGINS=http://localhost:3002
          EOF
      - name: Start stack
        run: docker compose up -d --build --wait
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3002 >/dev/null; then
              echo "frontend ready"; exit 0
            fi
            sleep 3
          done
          echo "frontend did not become ready" >&2; exit 1
      - name: Run full Playwright suite
        run: npx playwright test
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3002
          E2E_API_URL: http://localhost:8002
      - name: Docker compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-full-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
