# Static type checking (Qualitätsplan Phase 2 R5).
# Scope: app/core and app/services first (domain logic); routes/models follow once
# these are clean. Run: mypy -p app.core -p app.services   (from backend/)
[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
show_error_codes = True
pretty = False
plugins = pydantic.mypy

[pydantic-mypy]
init_typed = True
